apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.shipmentService.name }}
spec:
  replicas: {{ .Values.shipmentService.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.shipmentService.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.shipmentService.name }}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.28
          command:
            - sh
            - -c
            - until nc -z {{ .Values.kafka.bootstrapServers | replace ":9092" "" }} 9092; do echo "Waiting for Kafka..."; sleep 3; done
      containers:
        - name: {{ .Values.shipmentService.name }}
          image: {{ .Values.image.registry }}/{{ .Values.shipmentService.image }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.shipmentService.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.shipmentService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.shipmentService.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.shipmentService.name }}
spec:
  type: NodePort    # expose ra ngoài để test
  selector:
    app: {{ .Values.shipmentService.name }}
  ports:
    - port: {{ .Values.shipmentService.port }}
      targetPort: {{ .Values.shipmentService.port }}
      nodePort: 30084   # port truy cập từ ngoài